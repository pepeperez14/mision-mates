<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Misión Mates"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#0a1130"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" type="image/png" href="icon-192.png"><style>:root{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style><title>Misión Mates</title>
<meta name="description" content="Misión Mates: fracciones, problemas y decimales (2.º ESO, Unidad 2) en una misión espacial interactiva.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Lexend:wght@400;500;600;700&display=swap">
<style>
/* Misión Mates — «sala de control»: espacio profundo alrededor, papel cuadriculado donde se piensa.
   Tema único deliberado (oscuro fuera, papel dentro): no cambia con el modo del sistema. */
:root {
  --space: #0a1130; --space2: #141c4d; --space3: #1f2a66; --glow: #8fb4ff;
  --paper: #fcfcff; --paper2: #f3f5ff; --grid: rgba(70, 100, 200, .085); --line: #dfe5f7;
  --ink: #1b2340; --navy: #24346e; --muted: #5d6a93; --soft: #e9edfb;
  --A: #f08a3c; --B: #d99a00; --C: #14a89e; --D: #8a5ce0; --R: #e0533e;
  --Ad: #c4561d; --Bd: #8a6400; --Cd: #0e7d75; --Dd: #6236b8;
  --ok: #14965a; --okbg: #e3f6ec; --no: #d2462f; --nobg: #fdebe7; --part: #b47800; --partbg: #fff4d6;
  --hud: #ffd166; --hudink: #2a1d00;
  --fd: "Chakra Petch", "Avenir Next Condensed", "Arial Narrow", system-ui, sans-serif;
  --fb: "Lexend", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --r: 18px; --r2: 12px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
button, a, input, label { touch-action: manipulation; }
body { margin: 0; background: var(--space); color: #eef1ff; font-family: var(--fb); font-size: 17px; line-height: 1.5; -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--space); }
#stars { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
#app { position: relative; z-index: 1; max-width: 1000px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px 40px; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--hud); outline-offset: 2px; }
h1, h2, h3, h4 { font-family: var(--fd); line-height: 1.15; margin: 0; text-wrap: balance; letter-spacing: .01em; }
p { margin: .4em 0; }
b { font-weight: 600; }
.small { font-size: .86em; }
.big { font-size: 1.25em; }
.muted { color: var(--muted); }
.row { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; justify-content: center; }
.ic { width: 1.2em; height: 1.2em; flex: none; vertical-align: -.22em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- barra superior */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; gap: 12px; padding: 10px 0; background: linear-gradient(var(--space) 70%, rgba(10, 17, 48, 0)); }
.top .ttl { flex: 1; min-width: 0; }
.top h1 { font-size: 1.32rem; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.eyebrow { display: block; font-family: var(--fd); font-size: .74rem; letter-spacing: .14em; text-transform: uppercase; color: var(--glow); }
.ib { display: inline-grid; place-items: center; width: 46px; height: 46px; border-radius: 14px; border: 1px solid rgba(143, 180, 255, .3); background: rgba(31, 42, 102, .7); color: #fff; flex: none; }
.ib:active { transform: scale(.95); }
.hud { display: flex; gap: 8px; align-items: center; flex: none; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 11px; border-radius: 999px; background: rgba(31, 42, 102, .85); border: 1px solid rgba(143, 180, 255, .28); font-family: var(--fd); font-weight: 700; font-size: .95rem; color: #fff; font-variant-numeric: tabular-nums; white-space: nowrap; }
.chip.fuel .ic { color: var(--hud); }
.chip.streak .ic { color: #ff8a5c; }

/* ---------- inicio */
.hero { display: grid; grid-template-columns: 1fr auto; gap: 18px; align-items: center; padding: 18px 20px; border-radius: 24px; background: radial-gradient(120% 140% at 0% 0%, #2a3a8c 0%, #18215a 55%, #121a48 100%); border: 1px solid rgba(143, 180, 255, .25); overflow: hidden; position: relative; }
.hero .who { display: flex; gap: 14px; align-items: center; min-width: 0; }
.hero .robi { width: 86px; flex: none; }
.hero h2 { font-size: 1.6rem; color: #fff; }
.hero .rank { font-family: var(--fd); color: var(--hud); letter-spacing: .06em; text-transform: uppercase; font-size: .88rem; font-weight: 700; }
.xpbar { margin-top: 8px; height: 12px; border-radius: 99px; background: rgba(255, 255, 255, .12); overflow: hidden; }
.xpbar i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, #ffd166, #ff9a3c); transition: width .8s; }
.xpnote { font-size: .8rem; color: #c8d3ff; margin-top: 4px; }
.rocketbox { width: 120px; text-align: center; }
.rocketbox svg { width: 100%; height: auto; }
.rocketbox .cap { font-family: var(--fd); font-size: .74rem; letter-spacing: .1em; text-transform: uppercase; color: var(--glow); }
.daily { margin-top: 14px; display: flex; gap: 16px; align-items: center; width: 100%; text-align: left; padding: 16px 18px; border-radius: 20px; border: 0; background: linear-gradient(100deg, #ffd166, #ff9a3c); color: var(--hudink); box-shadow: 0 10px 30px rgba(255, 154, 60, .25); }
.daily .dic { width: 54px; height: 54px; border-radius: 16px; background: rgba(255, 255, 255, .45); display: grid; place-items: center; flex: none; }
.daily .dic .ic { width: 30px; height: 30px; }
.daily h3 { font-size: 1.25rem; }
.daily p { margin: 2px 0 0; font-size: .92rem; }
.daily.done { background: linear-gradient(100deg, #9be7c4, #5cc8a0); box-shadow: none; }
.sech { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin: 22px 2px 10px; }
.sech h2 { font-size: 1.12rem; color: #fff; letter-spacing: .04em; text-transform: uppercase; }
.sech span { color: #aab8ee; font-size: .85rem; }
.stations { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.st { position: relative; display: grid; grid-template-columns: 64px 1fr; gap: 12px; align-items: center; padding: 14px; border-radius: 20px; border: 1px solid rgba(143, 180, 255, .22); background: rgba(22, 30, 80, .88); text-align: left; color: #fff; min-width: 0; }
.st:active { transform: scale(.985); }
.st .pl { width: 64px; height: 64px; }
.st h3 { font-size: 1.08rem; }
.st .code { font-family: var(--fd); font-size: .76rem; letter-spacing: .12em; color: var(--c); text-transform: uppercase; font-weight: 700; }
.st .sub { font-size: .82rem; color: #b9c4f0; }
.pbar { height: 8px; border-radius: 99px; background: rgba(255, 255, 255, .12); overflow: hidden; margin-top: 7px; }
.pbar i { display: block; height: 100%; background: var(--c); border-radius: 99px; }
.st .cnt { font-size: .78rem; color: #c9d3ff; margin-top: 4px; }
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.tile { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; padding: 14px; border-radius: 18px; border: 1px solid rgba(143, 180, 255, .22); background: rgba(22, 30, 80, .88); color: #fff; text-align: left; min-width: 0; }
.tile .tic { width: 42px; height: 42px; border-radius: 13px; display: grid; place-items: center; background: var(--c); color: #fff; }
.tile .tic .ic { width: 24px; height: 24px; }
.tile h3 { font-size: 1.02rem; }
.tile p { margin: 0; font-size: .82rem; color: #b9c4f0; }
.foot { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 24px; }
.lnk { display: inline-flex; align-items: center; gap: 8px; padding: 10px 14px; border-radius: 14px; background: rgba(31, 42, 102, .6); border: 1px solid rgba(143, 180, 255, .2); color: #dfe6ff; font-size: .92rem; }

/* ---------- tarjetas de papel */
.card { color-scheme: light; background-color: var(--paper); color: var(--ink); border-radius: var(--r); box-shadow: 0 18px 40px rgba(0, 0, 0, .28); }
.paper { background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 24px 24px; background-position: -1px -1px; }

/* ---------- estación */
.sthead { background: var(--c); display: flex; gap: 16px; align-items: center; padding: 16px 18px; border-radius: 22px; background: linear-gradient(110deg, var(--c), color-mix(in srgb, var(--c) 55%, #141c4d)); color: #fff; }
.sthead .pl { width: 72px; height: 72px; flex: none; }
.sthead h2 { font-size: 1.45rem; }
.sthead p { margin: 2px 0 0; opacity: .92; font-size: .92rem; }
.sklist { display: grid; gap: 10px; margin-top: 14px; }
.sk { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; padding: 12px 14px; }
.sk .code { font-family: var(--fd); font-weight: 700; color: #fff; background: var(--c); border-radius: 10px; padding: 6px 8px; min-width: 46px; text-align: center; }
.sk h3 { font-size: 1.05rem; color: var(--ink); }
.sk .en { font-size: .8rem; color: var(--muted); font-style: italic; }
.sk .btns { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.sk .meta { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 4px; }
.mast { display: inline-flex; gap: 3px; vertical-align: middle; }
.mast i { width: 16px; height: 16px; border-radius: 4px; background: #e2e7f6; border: 1px solid #cdd5ee; }
.mast i.on1 { background: #ffd6c2; border-color: #f3a988; }
.mast i.on2 { background: #ffc06b; border-color: #e89a2e; }
.mast i.on3 { background: #6fd3a6; border-color: #33a874; }
.mast i.on4 { background: #6a4fe0; border-color: #4a32b8; }
.mlabel { font-size: .8rem; color: var(--muted); }
.lifelink { border: 0; background: none; color: var(--navy); font-size: .82rem; text-decoration: underline; text-underline-offset: 3px; padding: 4px 0; }

/* ---------- botones */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 10px 18px; border-radius: 14px; border: 2px solid transparent; font-weight: 600; font-size: 1rem; }
.btn:active { transform: translateY(1px) scale(.99); }
.btn.primary { background: var(--navy); color: #fff; }
.btn.go { background: var(--ok); color: #fff; }
.btn.hot { background: linear-gradient(100deg, #ffd166, #ff9a3c); color: var(--hudink); }
.btn.ghost { background: #fff; color: var(--navy); border-color: #cfd8f3; }
.btn.soft { background: var(--soft); color: var(--navy); }
.btn.sm { min-height: 40px; padding: 6px 12px; font-size: .9rem; border-radius: 12px; }
.btn[disabled] { opacity: .45; pointer-events: none; }
.btn.wide { width: 100%; }

/* ---------- práctica */
.dots { display: flex; gap: 5px; flex-wrap: wrap; }
.dots i { width: 12px; height: 12px; border-radius: 50%; background: rgba(255, 255, 255, .18); border: 1px solid rgba(255, 255, 255, .25); }
.dots i.now { background: var(--hud); border-color: var(--hud); }
.dots i.r1 { background: #43d38c; border-color: #43d38c; }
.dots i.r5 { background: #ffc35c; border-color: #ffc35c; }
.dots i.r0 { background: #ff8e7a; border-color: #ff8e7a; }
.prac { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; align-items: start; }
.prac.haskp { grid-template-columns: minmax(0, 1fr) 270px; }
.ex { padding: 18px 20px 16px; position: relative; overflow: hidden; }
.exhead { display: flex; justify-content: space-between; gap: 10px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
.skchip { background: #eef1ff; color: var(--navy); display: inline-flex; gap: 6px; align-items: center; padding: 5px 10px; border-radius: 99px; background: color-mix(in srgb, var(--c) 16%, #fff); color: color-mix(in srgb, var(--c) 70%, #1b2340); font-family: var(--fd); font-weight: 700; font-size: .84rem; letter-spacing: .03em; }
.lvtag { font-family: var(--fd); font-size: .78rem; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
.donest { display: grid; gap: 6px; margin-bottom: 10px; }
.donest .ds { display: flex; gap: 8px; align-items: baseline; font-size: .9rem; color: #3d4a73; padding: 6px 10px; border-radius: 10px; background: #eef8f2; }
.donest .ds .ic { color: var(--ok); }
.q { font-size: 1.12rem; line-height: 1.55; }
.prob { font-size: 1.08rem; line-height: 1.55; padding: 10px 14px; border-radius: 12px; background: #fff7e2; border: 1px solid #f1dfaa; margin: 0 0 10px; }
.q .small { color: var(--muted); }
.stepn { display: inline-block; font-family: var(--fd); font-size: .78rem; letter-spacing: .1em; text-transform: uppercase; color: #fff; background: var(--navy); padding: 2px 8px; border-radius: 8px; margin-right: 6px; vertical-align: 2px; }
.exline { margin: 10px 0 4px; font-size: 1.28rem; overflow-x: auto; padding: 6px 2px; }
.figwrap { margin: 12px 0 4px; overflow-x: auto; text-align: center; }
svg.fig { max-width: 100%; height: auto; display: inline-block; }
.optfig svg.fig { max-width: 100%; width: 300px; }
.inp { margin-top: 14px; }
.cmp { display: inline-flex; gap: 12px; align-items: center; font-size: 1.6rem; font-variant-numeric: tabular-nums; }
.qbox { display: inline-grid; place-items: center; width: 1.6em; height: 1.6em; border: 2px dashed #9aa8d6; border-radius: 10px; color: #9aa8d6; font-size: .9em; }

/* entradas numéricas grandes (válidas para escribir con el lápiz) */
.numin { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.nin { width: 9.5em; max-width: 100%; height: 64px; padding: 0 14px; border-radius: 14px; border: 2px solid #c3cdee; background: #fff; color: var(--ink); font: 600 28px/1 var(--fb); font-variant-numeric: tabular-nums; text-align: center; caret-color: var(--navy); }
.nin:focus { border-color: var(--navy); box-shadow: 0 0 0 4px rgba(36, 52, 110, .14); outline: none; }
.nin.act { border-color: var(--navy); }
.unit { font-size: 1.1rem; font-weight: 600; color: var(--muted); }
.frin { display: inline-flex; flex-direction: column; align-items: center; gap: 6px; }
.frin .nin { width: 4.4em; height: 58px; }
.frin .fbar { width: 5.2em; height: 4px; border-radius: 2px; background: var(--ink); }
.frrow { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.frnote { font-size: .82rem; color: var(--muted); max-width: 22em; }
.numsrow { display: flex; gap: 10px; flex-wrap: wrap; }
.numsrow .nin { width: 6.2em; }

/* opciones */
.opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.opts.c1 { grid-template-columns: minmax(0, 1fr); }
.opts.sign { grid-template-columns: repeat(3, minmax(0, 96px)); justify-content: start; }
.opt { min-height: 54px; padding: 10px 14px; border-radius: 14px; border: 2px solid #cfd8f3; background: #fff; color: var(--ink); font-size: 1.05rem; text-align: left; line-height: 1.35; }
.opts.sign .opt { text-align: center; font: 700 2rem/1 var(--fd); min-height: 72px; }
.opt.sel { border-color: var(--navy); background: #eef1ff; }
.opt.right { border-color: var(--ok); background: var(--okbg); }
.opt.wrong { border-color: var(--no); background: var(--nobg); opacity: .8; }
.opt[disabled] { cursor: default; }
.opt .optfig { pointer-events: none; }

/* ordenar */
.ordslots { display: flex; flex-wrap: wrap; gap: 8px; min-height: 60px; padding: 8px; border-radius: 14px; border: 2px dashed #b9c4ea; background: #f7f9ff; align-items: center; }
.ordslots .sep { color: var(--muted); font-weight: 700; }
.ordslots .ph { color: #98a3c9; font-size: .9rem; padding: 0 6px; }
.ordpool { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.tok { min-width: 74px; min-height: 52px; padding: 8px 14px; border-radius: 12px; border: 2px solid #c3cdee; background: #fff; font: 600 1.25rem/1 var(--fb); color: var(--ink); font-variant-numeric: tabular-nums; }
.tok.in { background: #e9efff; border-color: var(--navy); }
.tok.used { visibility: hidden; }

/* cifras tocables */
.digits { display: inline-flex; gap: 4px; align-items: flex-end; flex-wrap: wrap; }
.dg { width: 56px; height: 70px; border-radius: 12px; border: 2px solid #c3cdee; background: #fff; font: 700 2.1rem/1 var(--fb); color: var(--ink); }
.dg.sel { border-color: var(--navy); background: #eef1ff; }
.dg.right { border-color: var(--ok); background: var(--okbg); }
.dg.wrong { border-color: var(--no); background: var(--nobg); }
.dcomma { font: 700 2.4rem/1 var(--fb); padding: 0 2px 6px; color: var(--ink); }
.gaps { display: inline-flex; align-items: center; flex-wrap: wrap; }
.gaps .gd { font: 700 2rem/1 var(--fb); padding: 0 2px; color: var(--ink); }
.gaps .gp { width: 26px; height: 64px; border: 0; background: none; position: relative; }
.gaps .gp::after { content: ""; position: absolute; left: 50%; top: 14px; bottom: 14px; width: 3px; margin-left: -1.5px; border-radius: 2px; background: #c9d2ef; }
.gaps .gp.sel::after { background: var(--R); width: 8px; height: 8px; top: auto; bottom: 10px; border-radius: 50%; margin-left: -4px; }
.shadebox { text-align: center; }
.shadebox svg .tp { cursor: pointer; }
.shadecount { font-size: .9rem; color: var(--muted); margin-top: 4px; }

/* acciones y respuesta */
.actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; align-items: center; }
.actions .grow { flex: 1; }
.hints { display: grid; gap: 8px; margin-top: 12px; }
.hint { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 12px; background: #fff8dd; border: 1px solid #f0dc96; font-size: .98rem; }
.hint .ic { color: #b98700; margin-top: 2px; }
.hint b.hn { font-family: var(--fd); color: #8a6400; margin-right: 4px; }
.fb { margin-top: 12px; }
.fbbox { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border-radius: 14px; animation: pop .25s ease-out; }
.fbbox .robi { width: 46px; flex: none; }
.fbbox .ft { font-family: var(--fd); font-weight: 700; font-size: 1.05rem; }
.fbbox.ok { background: var(--okbg); border: 1px solid #a7dfc0; }
.fbbox.ok .ft { color: var(--ok); }
.fbbox.no { background: var(--nobg); border: 1px solid #f3bcb0; }
.fbbox.no .ft { color: var(--no); }
.fbbox.part { background: var(--partbg); border: 1px solid #eed38b; }
.fbbox.part .ft { color: var(--part); }
.fbbox.inv { background: #eef1fb; border: 1px solid #d3dbf3; }
.errtag { display: inline-block; margin-top: 4px; font-size: .78rem; font-family: var(--fd); letter-spacing: .04em; color: #8a3b2b; background: #fff; border: 1px solid #f1c2b6; border-radius: 8px; padding: 2px 8px; }
@keyframes pop { from { transform: scale(.97); opacity: .4; } to { transform: none; opacity: 1; } }
.shake { animation: shake .35s; }
@keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
.sol { margin-top: 14px; padding: 14px 16px; border-radius: 14px; background: #f1f4ff; border: 1px solid #d4dcf5; }
.sol h4 { font-size: 1.05rem; color: var(--navy); margin-bottom: 6px; display: flex; gap: 8px; align-items: center; }
.sol ol { margin: 0; padding-left: 1.2em; display: grid; gap: 6px; }
.sol .solfig { text-align: center; overflow-x: auto; }
.stp { display: grid; grid-template-columns: 28px 1fr; gap: 8px; align-items: start; }
.stp .sn { width: 26px; height: 26px; border-radius: 50%; background: var(--navy); color: #fff; display: grid; place-items: center; font: 700 .85rem/1 var(--fd); margin-top: 4px; }
.stp .sub { color: var(--ok); font-weight: 600; margin-top: 2px; }
.hl { background: #ffe58a; border-radius: 6px; box-shadow: 0 0 0 3px #ffe58a; }

/* teclado de Robi */
.kp { padding: 12px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 76px); }
.kp .keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.key { min-height: 56px; border-radius: 13px; border: 1px solid #cfd8f3; background: #fff; color: var(--ink); font: 700 1.45rem/1 var(--fb); box-shadow: 0 2px 0 #cfd8f3; }
.key:active { transform: translateY(2px); box-shadow: none; background: #eef1ff; }

/* borrador */
.pad { position: fixed; inset: 0; z-index: 60; display: flex; flex-direction: column; background: #fbfcff; color: var(--ink); color-scheme: light; }

/* modal */

/* toast y confeti */
.toast { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); top: calc(env(safe-area-inset-top, 0px) + 66px); z-index: 80; padding: 10px 16px; border-radius: 99px; background: var(--hud); color: var(--hudink); font: 700 1rem/1 var(--fd); box-shadow: 0 10px 30px rgba(0, 0, 0, .3); animation: toast 1.9s ease forwards; pointer-events: none; white-space: nowrap; }
@keyframes toast { 0% { opacity: 0; transform: translateY(-8px); } 12% { opacity: 1; transform: none; } 80% { opacity: 1; } 100% { opacity: 0; transform: translateY(-12px); } }
.confetti { position: fixed; inset: 0; pointer-events: none; z-index: 90; overflow: hidden; }
.confetti i { position: absolute; top: -20px; width: 10px; height: 14px; border-radius: 2px; }

/* familia, insignias, clase */

/* jefe final y contrarreloj */

/* lienzos de dibujo (Apple Pencil) */

</head><body><div id="app"><noscript><p style="padding:20px;color:#fff">Misión Mates necesita JavaScript activado.</p></noscript></div>
<script>
window.MM_STANDALONE = true;
/* Misión Mates · core.js — núcleo matemático, formato, figuras SVG y expresiones */
(function (G) {
'use strict';
const MM = G.MM || (G.MM = {});

/* ---------------------------------------------------------------- azar */
let R = Math.random;
MM.seed = function (s) {
  let a = s >>> 0;
  R = function () {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
};
MM.unseed = function () { R = Math.random; };
const rnd = () => R();
const ri = (a, b) => a + Math.floor(R() * (b - a + 1));
const pick = a => a[Math.floor(R() * a.length)];
const chance = p => R() < p;
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(R() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
const sample = (a, k) => shuffle(a).slice(0, k);
Object.assign(MM, { rnd, ri, pick, chance, shuffle, sample });

/* ---------------------------------------------------------- fracciones */
function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) { const t = a % b; a = b; b = t; } return a; }
function lcm(a, b) { return a / gcd(a, b) * b; }
function pow10(k) { let p = 1; for (let i = 0; i < k; i++) p *= 10; return p; }

class F {
  constructor(n, d) {
    if (d === undefined) d = 1;
    if (!Number.isSafeInteger(n) || !Number.isSafeInteger(d) || d === 0) throw new Error('Fracción no válida: ' + n + '/' + d);
    if (d < 0) { n = -n; d = -d; }
    const g = gcd(n, d) || 1;
    this.n = n / g; this.d = d / g;
    if (this.n === 0) { this.n = 0; this.d = 1; }
  }
  static of(x) { if (x instanceof F) return x; if (typeof x === 'string') return MM.D(x); return new F(x, 1); }
  add(o) { o = F.of(o); return new F(this.n * o.d + o.n * this.d, this.d * o.d); }
  sub(o) { o = F.of(o); return new F(this.n * o.d - o.n * this.d, this.d * o.d); }
  mul(o) { o = F.of(o); return new F(this.n * o.n, this.d * o.d); }
  div(o) { o = F.of(o); if (o.n === 0) throw new Error('División entre 0'); return new F(this.n * o.d, this.d * o.n); }
  neg() { return new F(-this.n, this.d); }
  inv() { return new F(this.d, this.n); }
  eq(o) { o = F.of(o); return this.n === o.n && this.d === o.d; }
  cmp(o) { o = F.of(o); const x = this.n * o.d - o.n * this.d; return x < 0 ? -1 : x > 0 ? 1 : 0; }
  lt(o) { return this.cmp(o) < 0; }
  gt(o) { return this.cmp(o) > 0; }
  get v() { return this.n / this.d; }
  isInt() { return this.d === 1; }
  str() { return this.d === 1 ? String(this.n) : this.n + '/' + this.d; }
  html() { return MM.M(this.str().replace('-', '−')); }
  isExact() { let d = this.d; while (d % 2 === 0) d /= 2; while (d % 5 === 0) d /= 5; return d === 1; }
}
MM.F = F; MM.gcd = gcd; MM.lcm = lcm; MM.pow10 = pow10;
MM.f = (n, d) => new F(n, d === undefined ? 1 : d);

/* "3,45" → F exacta */
MM.D = function (s) {
  s = String(s).replace(/[\s   ]/g, '').replace(/[−–]/g, '-').replace('.', ',');
  const m = s.match(/^(-?)(\d*)(?:,(\d+))?$/);
  if (!m) throw new Error('Decimal no válido: ' + s);
  const dp = m[3] || '';
  const n = parseInt((m[2] || '0') + dp, 10) * (m[1] ? -1 : 1);
  return new F(n, pow10(dp.length));
};

/* partes de un decimal exacto */
function decParts(f) {
  let t = f.d, c2 = 0, c5 = 0;
  while (t % 2 === 0) { t /= 2; c2++; }
  while (t % 5 === 0) { t /= 5; c5++; }
  if (t !== 1) return null;
  const s = Math.max(c2, c5);
  const m = Math.abs(f.n) * (pow10(s) / f.d);
  let str = String(m);
  if (s > 0) str = str.padStart(s + 1, '0');
  return { neg: f.n < 0, ip: s > 0 ? str.slice(0, str.length - s) : str, dp: s > 0 ? str.slice(str.length - s) : '' };
}
MM.decPlaces = function (x) { const p = decParts(F.of(x)); return p ? p.dp.length : null; };

/* F → "3,45" (con espacio fino de millares a partir de 5 cifras) */
MM.fmt = function (x, o) {
  o = o || {};
  const f = F.of(x);
  const p = decParts(f);
  if (!p) return MM.periodic(f).txt;
  let ip = p.ip;
  if (o.group !== false && ip.length >= 5) ip = ip.replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
  let dp = p.dp;
  if (o.minDec && dp.length < o.minDec) dp = dp.padEnd(o.minDec, '0');
  return (p.neg ? '−' : '') + ip + (dp ? ',' + dp : '');
};

/* desarrollo decimal (posiblemente periódico) de una fracción */
MM.periodic = function (f) {
  f = F.of(f);
  const neg = f.n < 0; let n = Math.abs(f.n); const d = f.d;
  const ip = Math.floor(n / d); let r = n % d;
  const seen = new Map(); let digs = '';
  while (r !== 0 && !seen.has(r) && digs.length < 60) { seen.set(r, digs.length); r *= 10; digs += Math.floor(r / d); r = r % d; }
  let pre = digs, rep = '';
  if (r !== 0 && seen.has(r)) { const k = seen.get(r); pre = digs.slice(0, k); rep = digs.slice(k); }
  let txt = (neg ? '−' : '') + ip;
  if (pre || rep) txt += ',' + pre;
  if (rep) { let shown = rep; while (shown.length < 3) shown += rep; txt += shown + '…'; }
  return { neg, ip: String(ip), pre, rep, txt, type: rep ? (pre ? 'mixto' : 'puro') : 'exacto' };
};

/* redondeo / truncado de un F a k decimales (exacto) */
MM.roundTo = function (x, k) { const f = F.of(x); const p = pow10(k); const s = f.n < 0 ? -1 : 1; const a = Math.abs(f.n) * p; const q = Math.floor(a / f.d); const r = a - q * f.d; const up = 2 * r >= f.d ? 1 : 0; return new F(s * (q + up), p); };
MM.truncTo = function (x, k) { const f = F.of(x); const p = pow10(k); const s = f.n < 0 ? -1 : 1; const q = Math.floor(Math.abs(f.n) * p / f.d); return new F(s * q, p); };

/* --------------------------------------------------- lectura de respuestas */
MM.parse = function (s) {
  if (s == null) return null;
  s = String(s).replace(/[\s   ]/g, '').replace(/[−–—]/g, '-').replace(/'/g, '');
  if (!s) return null;
  if (s.replace(/\D/g, '').length > 13) return { err: 'long' };
  let m = s.match(/^(-?)(\d+)\/(-?)(\d+)$/);
  if (m) {
    const n = parseInt(m[2], 10), d = parseInt(m[4], 10);
    if (d === 0) return { err: 'den0' };
    const sg = (m[1] === '-') !== (m[3] === '-') ? -1 : 1;
    return { v: new F(sg * n, d), kind: 'frac', rn: sg * n, rd: d };
  }
  m = s.match(/^(-?)(\d{1,3}(?:\.\d{3})+)(?:,(\d+))?$/);
  if (m && (m[3] !== undefined || (m[2].match(/\./g) || []).length > 1)) {
    const ip = m[2].replace(/\./g, ''), dp = m[3] || '';
    return { v: new F((m[1] ? -1 : 1) * parseInt(ip + dp, 10), pow10(dp.length)), kind: dp ? 'dec' : 'int', thousands: true };
  }
  m = s.match(/^(-?)(\d*)([.,])(\d+)$/);
  if (m) {
    const ip = m[2] || '0';
    const r = { v: new F((m[1] ? -1 : 1) * parseInt(ip + m[4], 10), pow10(m[4].length)), kind: 'dec', sep: m[3], decs: m[4].length };
    if (m[3] === '.' && m[2] && m[4].length === 3) r.alt = new F((m[1] ? -1 : 1) * parseInt(m[2] + m[4], 10), 1);
    return r;
  }
  m = s.match(/^(-?)(\d+)$/);
  if (m) return { v: new F((m[1] ? -1 : 1) * parseInt(m[2], 10), 1), kind: 'int' };
  if (/^-?\d+[.,]$/.test(s)) return { v: new F(parseInt(s, 10), 1), kind: 'int' };
  return { err: 'nan' };
};

/* ------------------------------------------------------ escritura matemática */
/* "2/3 + 1/4" → HTML con fracciones apiladas. Los saltos de línea solo antes de un operador. */
MM.M = function (s) {
  s = String(s);
  s = s.replace(/(\d+|\?|x)\/(\d+|\?)/g, (all, a, b) => '<span class="fr"><span>' + a + '</span><span>' + b + '</span></span>');
  s = s.replace(/ ([+−·×÷=<>≈:→]) /g, ' $1 ');
  return '<span class="mx">' + s + '</span>';
};
/* número decimal como HTML */
MM.N = function (x) { return MM.fmt(x); };
/* fracción o entero (F) como texto para M */
MM.fs = function (f) { f = F.of(f); return f.d === 1 ? (f.n < 0 ? '−' + (-f.n) : String(f.n)) : (f.n < 0 ? '−' + (-f.n) + '/' + f.d : f.n + '/' + f.d); };

/* --------------------------------------------------------------- SVG */
const NAVY = '#24346e';
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');
MM.esc = esc;
function svg(w, h, body, cls, label) {
  return '<svg class="fig ' + (cls || '') + '" viewBox="0 0 ' + w + ' ' + h + '" width="' + w + '" height="' + h + '" role="img"' + (label ? ' aria-label="' + esc(label) + '"' : '') + '>' + body + '</svg>';
}
MM.svg = svg;
function txt(x, y, t, o) {
  o = o || {};
  return '<text x="' + x + '" y="' + y + '" text-anchor="' + (o.a || 'middle') + '" font-size="' + (o.s || 16) + '" font-weight="' + (o.w || 600) + '" fill="' + (o.c || NAVY) + '"' + (o.cls ? ' class="' + o.cls + '"' : '') + ' dominant-baseline="middle">' + esc(t) + '</text>';
}
MM.txt = txt;

/* pastel: n partes, sombreadas = número o array de índices */
MM.pie = function (n, shaded, o) {
  o = o || {};
  const r = o.r || 62, pad = 6, S = 2 * r + 2 * pad, cx = S / 2, cy = S / 2;
  const set = Array.isArray(shaded) ? new Set(shaded) : new Set([...Array(shaded).keys()]);
  const col = o.color || '#f08a3c';
  let b = '';
  if (n === 1) b += '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="' + (set.has(0) ? col : '#fff') + '" stroke="' + NAVY + '" stroke-width="2.5" data-i="0" class="' + (o.tap ? 'tp' : '') + '"/>';
  else for (let i = 0; i < n; i++) {
    const a0 = -Math.PI / 2 + i * 2 * Math.PI / n, a1 = a0 + 2 * Math.PI / n;
    const x0 = cx + r * Math.cos(a0), y0 = cy + r * Math.sin(a0), x1 = cx + r * Math.cos(a1), y1 = cy + r * Math.sin(a1);
    b += '<path d="M' + cx + ' ' + cy + ' L' + x0.toFixed(2) + ' ' + y0.toFixed(2) + ' A' + r + ' ' + r + ' 0 ' + (n === 2 ? 0 : 0) + ' 1 ' + x1.toFixed(2) + ' ' + y1.toFixed(2) + ' Z" fill="' + (set.has(i) ? col : '#fff') + '" stroke="' + NAVY + '" stroke-width="2.5" stroke-linejoin="round" data-i="' + i + '" class="' + (o.tap ? 'tp' : '') + '"/>';
  }
  return svg(S, S, b, 'pie ' + (o.cls || ''), o.label || (set.size + ' de ' + n + ' partes coloreadas'));
};

/* barra simple: n partes, sombreadas = número o array */
MM.bar = function (n, shaded, o) {
  o = o || {};
  const W = o.w || 420, H = o.h || 54, pad = 4;
  const set = Array.isArray(shaded) ? new Set(shaded) : new Set([...Array(shaded).keys()]);
  const col = o.color || '#f08a3c';
  const cw = (W - 2 * pad) / n;
  let b = '';
  for (let i = 0; i < n; i++) {
    const x = pad + i * cw;
    b += '<rect x="' + x.toFixed(2) + '" y="' + pad + '" width="' + cw.toFixed(2) + '" height="' + (H - 2 * pad) + '" fill="' + (set.has(i) ? col : '#fff') + '" stroke="' + NAVY + '" stroke-width="2.5" data-i="' + i + '" class="' + (o.tap ? 'tp' : '') + '"/>';
    if (o.texts && o.texts[i] != null) b += txt(x + cw / 2, H / 2, o.texts[i], { s: o.fs || 15 });
  }
  return svg(W, H, b, 'bar ' + (o.cls || ''), o.label || (set.size + ' de ' + n + ' partes coloreadas'));
};

/* modelo de barras (tape diagram) con varias filas y llaves */
/* rows: [{x0,x1,n,fills:[],texts:[],label}] ; braces: [{row,from,to,text,pos:'top'|'bot',c}] */
MM.tape = function (spec) {
  const W = spec.w || 600, pad = 12, iw = W - 2 * pad, rowH = spec.rowH || 46;
  const rows = spec.rows, braces = spec.braces || [];
  let y = 6, b = '';
  const geo = [];
  rows.forEach((r, k) => {
    if (braces.some(q => q.row === k && q.pos === 'top')) y += 34;
    geo[k] = { y };
    const cw = (r.x1 - r.x0) * iw / r.n;
    for (let i = 0; i < r.n; i++) {
      const x = pad + r.x0 * iw + i * cw;
      b += '<rect x="' + x.toFixed(2) + '" y="' + y + '" width="' + cw.toFixed(2) + '" height="' + rowH + '" fill="' + ((r.fills && r.fills[i]) || '#fff') + '" stroke="' + NAVY + '" stroke-width="2.2"/>';
      if (r.texts && r.texts[i] != null && r.texts[i] !== '') b += txt(x + cw / 2, y + rowH / 2 + 1, r.texts[i], { s: r.fs || (cw < 34 ? 12 : 15), w: 700 });
    }
    y += rowH;
    if (braces.some(q => q.row === k && q.pos !== 'top')) y += 36;
    y += r.gap != null ? r.gap : 14;
  });
  braces.forEach(q => {
    const r = rows[q.row], cw = (r.x1 - r.x0) * iw / r.n;
    const xa = pad + r.x0 * iw + q.from * cw + 3, xb = pad + r.x0 * iw + q.to * cw - 3;
    const c = q.c || NAVY;
    if (q.pos === 'top') {
      const yy = geo[q.row].y - 7;
      b += '<path d="M' + xa + ' ' + (yy + 2) + ' v-8 H' + xb + ' v8" fill="none" stroke="' + c + '" stroke-width="2.4" stroke-linejoin="round"/>';
      b += txt((xa + xb) / 2, yy - 17, q.text, { s: 15, w: 700, c });
    } else {
      const yy = geo[q.row].y + rowH + 7;
      b += '<path d="M' + xa + ' ' + (yy - 2) + ' v8 H' + xb + ' v-8" fill="none" stroke="' + c + '" stroke-width="2.4" stroke-linejoin="round"/>';
      b += txt((xa + xb) / 2, yy + 20, q.text, { s: 15, w: 700, c });
    }
  });
  y -= 8;
  return svg(W, Math.ceil(y), b, 'tape', spec.label || 'Modelo de barras');
};

/* recta numérica: valores en decimal; a,b,step números; marks [{v,t,c,pos}] */
MM.numline = function (o) {
  const W = o.w || 600, H = o.h || 96, pad = 30, iw = W - 2 * pad, y = o.y || 50;
  const a = o.a, bb = o.b, step = o.step;
  const count = Math.round((bb - a) / step);
  const dec = Math.max(0, Math.round(-Math.log10(step) + 0.3));
  const X = v => pad + (v - a) / (bb - a) * iw;
  let b = '<line x1="' + (pad - 12) + '" y1="' + y + '" x2="' + (W - pad + 12) + '" y2="' + y + '" stroke="' + NAVY + '" stroke-width="2.5" stroke-linecap="round"/>';
  if (o.hl) b += '<rect x="' + X(o.hl[0]) + '" y="' + (y - 7) + '" width="' + (X(o.hl[1]) - X(o.hl[0])) + '" height="14" fill="#14a89e" opacity=".22"/>';
  for (let i = 0; i <= count; i++) {
    const v = a + i * step, x = X(v);
    const major = o.major ? (i % o.major === 0) : true;
    b += '<line x1="' + x.toFixed(2) + '" y1="' + (y - (major ? 10 : 6)) + '" x2="' + x.toFixed(2) + '" y2="' + (y + (major ? 10 : 6)) + '" stroke="' + NAVY + '" stroke-width="' + (major ? 2.2 : 1.4) + '"/>';
    if (major && o.labels !== false) b += txt(x, y + 26, MM.fmt(MM.D(v.toFixed(dec))), { s: o.fs || 13, w: 600, c: '#3b4a7a' });
  }
  (o.marks || []).forEach(m => {
    const x = X(m.v), c = m.c || '#e0533e';
    b += '<circle cx="' + x.toFixed(2) + '" cy="' + y + '" r="7" fill="' + c + '" stroke="#fff" stroke-width="2"/>';
    if (m.t) b += txt(x, m.pos === 'down' ? y + 46 : y - 24, m.t, { s: 14, w: 700, c });
  });
  return svg(W, H, b, 'numline', o.label || 'Recta numérica');
};

/* tabla de valor posicional */
const PV_INT = ['U', 'D', 'C', 'UM', 'DM', 'CM'];
const PV_INT_N = ['unidades', 'decenas', 'centenas', 'unidades de millar', 'decenas de millar', 'centenas de millar'];
const PV_DEC = ['d', 'c', 'm', 'dm', 'cm', 'mm'];
const PV_DEC_N = ['décimas', 'centésimas', 'milésimas', 'diezmilésimas', 'cienmilésimas', 'millonésimas'];
MM.PV = { PV_INT, PV_INT_N, PV_DEC, PV_DEC_N };
MM.pvTable = function (s, o) {
  o = o || {};
  s = String(s).replace(/[\s ]/g, '');
  const [ip, dp = ''] = s.split(',');
  const ni = Math.max(ip.length, o.ni || 0), nd = Math.max(dp.length, o.nd || 0);
  let h1 = '<tr>', h2 = '<tr>', r = '<tr>';
  for (let k = ni - 1; k >= 0; k--) {
    const dig = ip[ip.length - 1 - k];
    const pos = 'i' + k;
    h1 += '<th class="pi">' + PV_INT[k] + '</th>'; h2 += '<td class="pn">' + PV_INT_N[k] + '</td>';
    r += '<td class="pd' + (o.hl === pos ? ' on' : '') + (dig === undefined ? ' em' : '') + '" data-pos="' + pos + '">' + (dig === undefined ? '' : dig) + '</td>';
  }
  h1 += '<th class="pc"></th>'; h2 += '<td class="pc"></td>'; r += '<td class="pc">' + (nd ? ',' : '') + '</td>';
  for (let k = 0; k < nd; k++) {
    const dig = dp[k]; const pos = 'd' + k;
    h1 += '<th class="pdh">' + PV_DEC[k] + '</th>'; h2 += '<td class="pn">' + PV_DEC_N[k] + '</td>';
    r += '<td class="pd dec' + (o.hl === pos ? ' on' : '') + (dig === undefined ? ' em' : '') + '" data-pos="' + pos + '">' + (dig === undefined ? '' : dig) + '</td>';
  }

function addSubSol(a, op, b) {
  const L = lcm(a.d, b.d), r = MM.applyOp(op, a, b);
  const out = [];
  if (a.d === b.d) out.push('Mismo denominador: ' + (op === '+' ? 'sumo' : 'resto') + ' los numeradores y dejo el ' + a.d + '.');
  else {
    out.push('mcm(' + a.d + ', ' + b.d + ') = <b>' + L + '</b>.');
    const cv = [];
    if (a.d !== L) cv.push(a.isInt() ? M(a.n + ' = ' + a.n * L + '/' + L) : M(fs(a) + ' = ' + a.n * L / a.d + '/' + L));
    if (b.d !== L) cv.push(M(fs(b) + ' = ' + b.n * L / b.d + '/' + L));
    out.push(cv.join(' y ') + (cv.length === 1 ? ' (la otra ya tiene denominador ' + L + ')' : ''));
  }
  const rn = a.n * L / a.d + (op === '+' ? 1 : -1) * b.n * L / b.d;
  out.push(M(a.n * L / a.d + '/' + L + ' ' + op + ' ' + b.n * L / b.d + '/' + L + ' = ' + rn + '/' + L) + (gcd(rn, L) > 1 && !r.isInt() || (r.isInt() && L !== 1) ? ' = ' + FM(r) : ''));
  return out;
}

const A6T = {

  if (S.streak.last !== t) {
    const y = new Date(); y.setDate(y.getDate() - 1);
    S.streak.n = S.streak.last === UI.dayKey(y) ? S.streak.n + 1 : 1;
    S.streak.last = t;
    S.streak.best = Math.max(S.streak.best, S.streak.n);
  }
};
UI.streakNow = function () { const S = UI.S; const y = new Date(); y.setDate(y.getDate() - 1); return (S.streak.last === UI.today() || S.streak.last === UI.dayKey(y)) ? S.streak.n : 0; };

UI.rank = function (xp) {

UI.addXP = function (n) {
  if (!n) return;
  const before = UI.rank(UI.S.xp);
  UI.S.xp += n;
  UI.toast('+' + n + ' de combustible');
  const after = UI.rank(UI.S.xp);
  if (after.i > before.i) setTimeout(() => UI.celebrate('¡Nuevo rango!', 'Ahora eres <b>' + after.name + '</b>. ¡Sigue así!', 'up'), 700);
  UI.save();
};

UI.toast = function (txt) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = txt; document.body.appendChild(t);
  setTimeout(() => t.remove(), 2000);
};
UI.confetti = function () {
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const box = document.createElement('div'); box.className = 'confetti'; document.body.appendChild(box);
  const cols = ['#f08a3c', '#d99a00', '#14a89e', '#8a5ce0', '#e0533e', '#ffd166', '#7fd4ff'];
  const W = window.innerWidth, H = window.innerHeight;
  for (let i = 0; i < 70; i++) {
    const p = document.createElement('i'); p.style.left = (Math.random() * W) + 'px'; p.style.background = cols[i % cols.length]; box.appendChild(p);
    const dx = (Math.random() - .5) * 200, rot = Math.random() * 720 - 360, dur = 1400 + Math.random() * 1400;
    try { p.animate([{ transform: 'translate(0,0) rotate(0deg)', opacity: 1 }, { transform: 'translate(' + dx + 'px,' + (H + 40) + 'px) rotate(' + rot + 'deg)', opacity: .9 }], { duration: dur, easing: 'cubic-bezier(.2,.6,.4,1)', delay: Math.random() * 300, fill: 'forwards' }); } catch (e) { /* sin animaciones */ }
  }

};
UI.modal = function (html, btns, o) {
  o = o || {};
  const m = document.createElement('div'); m.className = 'modal'; m.setAttribute('role', 'dialog'); m.setAttribute('aria-modal', 'true');
  m.innerHTML = '<div class="card">' + html + '<div class="mbtns"></div></div>';
  const bx = $('.mbtns', m);
  const close = () => { m.remove(); document.removeEventListener('keydown', onKey); };
  (btns || [{ t: 'Cerrar', cls: 'primary' }]).forEach(b => {
    const e = document.createElement('button'); e.className = 'btn ' + (b.cls || 'ghost'); e.innerHTML = b.t;
    e.addEventListener('click', () => { if (b.fn && b.fn(m) === false) return; close(); });
    bx.appendChild(e);
  });
  if (o.dismiss !== false) m.addEventListener('click', e => { if (e.target === m) close(); });
  const onKey = e => { if (e.key === 'Escape' && o.dismiss !== false) close(); };
  document.addEventListener('keydown', onKey);
  document.body.appendChild(m);
  const first = $('input', m) || $('.mbtns .btn:last-child', m); if (first) setTimeout(() => { try { first.focus(); } catch (e) { /* nada */ } }, 30);

};

/* ======================================================= sonidos (WebAudio, tras la primera interacción) */
let AC = null;
function ac() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; } }
  if (AC && AC.state === 'suspended') { try { AC.resume(); } catch (e) { /* nada */ } }
  return AC;
}
function tone(a, freq, t0, dur, type, vol) {
  const o = a.createOscillator(), g = a.createGain();

  g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol || .1, t0 + .015); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(a.destination); o.start(t0); o.stop(t0 + dur + .05);
}
UI.snd = function (kind) {
  if (!UI.S.set.sound) return;
  const a = ac(); if (!a) return;
  try {
    const t = a.currentTime + .01;
    if (kind === 'ok') { tone(a, 660, t, .13, 'sine', .11); tone(a, 990, t + .09, .2, 'sine', .1); }
    else if (kind === 'no') { tone(a, 262, t, .16, 'triangle', .09); tone(a, 220, t + .12, .22, 'triangle', .07); }
    else if (kind === 'tap') tone(a, 600, t, .05, 'sine', .04);
    else if (kind === 'up') [523, 659, 784, 1047].forEach((fq, i) => tone(a, fq, t + i * .09, .18, 'triangle', .1));

    else if (t === 'shade') { shadeSet = new Set([0]); if (st.ans === 1) shadeSet.add(1); drawShade(st); $('[data-a="check"]', host).click(); }

SCREENS.lesson = function (id) {
  if (!UI.lessonOpen(id)) { const p = UI.prevSkill(id); UI.toast('Primero, la lección ' + p); CUR = ['lesson', p]; return SCREENS.lesson(p); }
  const steps = MM.LESSONS[id], sk = MM.SKILLS[id], B = blockOf(id);
  let i = 0; const ok = new Set();
  appEl().innerHTML = topbar({ title: sk.name, eyebrow: id + ' · Lección' }) + '<section class="card lesson paper" style="--c:' + B.color + '"></section>';
  const card = $('.lesson');
  const draw = () => {
    const s = steps[i];
    let h = '<div class="lprog">' + steps.map((_, k) => '<i class="' + (k <= i ? 'on' : '') + '"></i>').join('') + '</div>';
    if (s.t === 'life') h += lifeHTML(id);
    else h += '<h2>' + (s.h || '') + '</h2>' + (s.p ? '<div class="lp">' + s.p + '</div>' : '');
    if (s.fig) h += '<div class="figwrap">' + s.fig + '</div>';
    if (s.t === 'hook') h += '<div class="hopts">' + s.opts.map((o, k) => '<button type="button" class="opt" data-h="' + k + '">' + o.h + '</button>').join('') + '</div><div class="fb"></div>';
    if (s.t === 'w') h += '<div class="wslot"></div>';
    if (s.t === 'ex') h += '<div class="q" style="margin-top:6px"><b>' + s.q + '</b></div><div class="exsteps"></div><div class="wtools" style="margin-top:8px"><button type="button" class="btn soft sm" data-es="1">Siguiente paso ' + UI.ic('next') + '</button></div>';
    if (s.t === 'try') h += '<div class="card ex" style="box-shadow:none;border:1px solid #dfe5f7;margin-top:8px"></div>';
    const last = i === steps.length - 1;
    h += '<div class="lnav"><button type="button" class="btn ghost" data-l="-1"' + (i === 0 ? ' disabled' : '') + '>' + UI.ic('back') + ' Atrás</button><button type="button" class="btn ' + (last ? 'go' : 'primary') + '" data-l="1">' + (last ? 'Terminar lección' : 'Siguiente') + ' ' + UI.ic(last ? 'check' : 'next') + '</button></div>';
    card.innerHTML = h;
    const nextB = $('[data-l="1"]', card);
    const need = s.t === 'hook' || s.t === 'w' || s.t === 'ex' || s.t === 'try';
    if (need && !ok.has(i)) nextB.disabled = true;
    const unlock = () => { ok.add(i); nextB.disabled = false; };
    if (s.t === 'hook') card.querySelectorAll('[data-h]').forEach(b => b.onclick = () => {
      const o = s.opts[+b.dataset.h];
      $$('[data-h]', card).forEach(x => x.classList.remove('right', 'wrong'));
      b.classList.add(o.ok ? 'right' : 'wrong');
      $('.fb', card).innerHTML = '<div class="fbbox ' + (o.ok ? 'ok' : 'part') + '">' + UI.robi(o.ok ? 'cheer' : 'wow', 'robi') + '<div><div class="ft">' + (o.ok ? '¡Bien pensado!' : '¡Interesante! Mira…') + '</div><div>' + o.fb + '</div></div></div>';
      UI.snd(o.ok ? 'ok' : 'tap');
      unlock();
    });
    if (s.t === 'w') UI.W[s.w]($('.wslot', card), s.args, unlock);
    if (s.t === 'ex') {
      let k = 0; const box = $('.exsteps', card), btn = $('[data-es]', card);
      const more = () => { box.insertAdjacentHTML('beforeend', '<div class="es">' + s.steps[k] + '</div>'); k++; if (k >= s.steps.length) { btn.remove(); unlock(); } };
      btn.onclick = () => { UI.snd('tap'); more(); };
      if (ok.has(i)) { while (k < s.steps.length) more(); }
    }
    if (s.t === 'try') {
      const host = $('.card.ex', card);
      const ex = MM.SKILLS[s.skill].gen(s.d);
      UI.mountExercise(host, ex, { why: false, allowSimilar: false, tag: 'Comprueba', onDone: r => { UI.record(s.skill, r); unlock(); host.insertAdjacentHTML('beforeend', '<div class="fbbox ' + (r.credit ? 'ok' : 'part') + '" style="margin-top:10px"><div><div class="ft">' + (r.credit === 1 ? '¡Lo has entendido!' : r.credit ? '¡Conseguido!' : 'Ya lo has visto resuelto') + '</div><div>Pulsa «Siguiente» para continuar.</div></div></div>'); const a = $('.actions', host); if (a) a.remove(); UI.refreshHud(); } });
    }
    card.onclick = e => {
      const b = e.target.closest('[data-l]'); if (!b || b.disabled) return;

      i = Math.max(0, Math.min(steps.length - 1, i + dir));
      draw(); window.scrollTo({ top: 0, behavior: 'smooth' });
    };
  };
  const finishLesson = () => {

    if (first) UI.addXP(20);
    UI.checkBadges();
    const bit = MM.BIT[id], drawn = !!UI.S.bit[id];
    card.innerHTML = '<div style="text-align:center">' + UI.robi('cheer', 'robi') + '<h2>¡Lección terminada!</h2><p>' + (first ? 'Has ganado <b>20 de combustible</b>. ' : '') + 'Ahora, a practicar: así se pasa de «Intentado» a «Competente».</p></div>'
      + '<div class="rule found"><span class="rtag">' + UI.ic('bulb') + (first ? ' ¡Regla descubierta para tu bitácora!' : ' La regla de tu bitácora') + '</span><b class="rh">' + bit.h + '</b><div>' + bit.r + '</div></div>'
      + (nxt && !wasOpen ? '<p class="unlockmsg">' + UI.ic('unlock') + ' Nueva lección desbloqueada: <b>' + nxt + ' · ' + MM.SKILLS[nxt].name + '</b></p>' : '')
      + '<div class="actions" style="justify-content:center"><button type="button" class="btn ghost" data-nav="back">Volver a la estación</button><button type="button" class="btn soft" data-nav="bit" data-replace="1" data-arg="' + id + '">' + UI.ic('pencil') + (drawn ? ' Ver mi página' : ' Dibujar mi página (+10)') + '</button><button type="button" class="btn hot" data-nav="practice" data-replace="1" data-arg="' + id + '">' + UI.ic('play') + ' Practicar ahora</button></div>';
    const r = $('.robi', card); if (r) r.style.width = '110px';
    refreshHud();
  };
  draw();
};

/* ======================================================= sesión de práctica (ronda de una habilidad) */
function pracFrame(o) {
  appEl().innerHTML = topbar({ title: o.title, eyebrow: o.eyebrow, under: '<div class="dots" aria-hidden="true"></div>' }) + '<main class="prac"><section class="card ex paper" id="exhost"></section><aside class="card kp" id="kphost" hidden>' + UI.keypadHTML() + '</aside></main>';
  UI.bindKeypad($('#kphost'));
  return { host: $('#exhost'), kp: $('#kphost') };
}
function drawDots(n, i, res) { const d = $('.top .dots'); if (!d) return; let h = ''; for (let k = 0; k < n; k++) h += '<i class="' + (k < res.length ? (res[k] === 1 ? 'r1' : res[k] > 0 ? 'r5' : 'r0') : k === i ? 'now' : '') + '"></i>'; d.innerHTML = h; }
function xpFor(r) { return (r.credit === 1 ? 10 : r.credit > 0 ? 5 : 2) + (r.whyOk ? 3 : 0); }
function applyRound(id, score) {
  const k = UI.sk(id), old = k.lv;
  const comp = score >= 0.999 ? 3 : score >= 0.7 ? 2 : 1;
  let nl;
  if (old === 4 && comp === 3) nl = 4; else if (comp >= old) nl = comp; else nl = Math.max(comp, old - 1);
  k.lv = nl; k.rounds++; return { old, nl };
}
function starsHTML(n) { let h = '<div class="stars">'; for (let k = 0; k < 3; k++) h += '<svg viewBox="0 0 24 24"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5L2.5 9.4l6.6-.9z" fill="' + (k < n ? '#ffc43d' : '#e2e7f6') + '" stroke="' + (k < n ? '#d99a00' : '#cdd5ee') + '" stroke-width="1.5" stroke-linejoin="round"/></svg>'; return h + '</div>'; }

SCREENS.practice = function (id) {
  if (!UI.practiceOpen(id)) { UI.toast('Primero, la lección'); CUR = ['lesson', id]; return SCREENS.lesson(id); }
  const sk = MM.SKILLS[id], k = UI.sk(id), B = blockOf(id);
  const sess = { n: 5, i: 0, res: [], d: k.lv >= 3 ? 3 : k.lv === 2 ? 2 : 1, extra: 0, xp: 0, codes: [], run: 0, perfect: true, seen: new Set() };
  const F = pracFrame({ title: sk.name, eyebrow: id + ' · Práctica · ' + UI.LV[k.lv] });
  guard = () => sess.i > 0 && sess.i < sess.n;
  const next = () => {
    drawDots(sess.n, sess.i, sess.res);
    if (sess.i >= sess.n) return summary();
    let ex;
    for (let t = 0; t < 8; t++) { try { ex = sk.gen(sess.d); } catch (e) { ex = sk.gen(1); } const sig = ex.stages.map(z => z.q).join('|'); if (!sess.seen.has(sig)) { sess.seen.add(sig); break; } }
    UI.mountExercise(F.host, ex, {
      kpHost: F.kp, allowSimilar: true, color: B.color, tag: 'Ejercicio ' + (sess.i + 1) + ' de ' + sess.n + ' · nivel ' + sess.d,
      onDone: r => {
        UI.record(id, r);
        sess.res.push(r.credit); sess.codes.push(...r.codes);
        if (r.credit < 1 || r.hints) sess.perfect = false;
        const x = xpFor(r); sess.xp += x; UI.addXP(x); refreshHud();
        if (r.credit === 1) { sess.run++; if (sess.run >= 2 && sess.d < 3) { sess.d++; sess.run = 0; } } else sess.run = 0;
        if (r.failed) { sess.d = Math.max(1, sess.d - 1); if (sess.extra < 2) { sess.n++; sess.extra++; } }
        sess.i++;
        UI.checkBadges();
        window.scrollTo({ top: 0, behavior: 'smooth' });
        next();
      }
    });
  };
  const summary = () => {
    guard = null;
    F.kp.hidden = true; F.host.parentElement.classList.remove('haskp');
    const score = sess.res.reduce((a, b) => a + b, 0) / sess.res.length;
    const ch = applyRound(id, score);
    const stars = score >= 0.95 ? 3 : score >= 0.75 ? 2 : score >= 0.4 ? 1 : 0;
    if (sess.perfect) UI.S.perfect++;
    const k2 = UI.sk(id); k2.best = Math.max(k2.best || 0, stars);
    const bonus = stars * 5; if (bonus) UI.addXP(bonus);
    UI.save(); UI.checkBadges(); refreshHud();
    if (stars === 3) { UI.confetti(); UI.snd('up'); }
    const firsts = sess.res.filter(x => x === 1).length;
    const errs = [...new Set(sess.codes)].filter(c => c !== 'calc' && MM.ERR[c]);
    F.host.innerHTML = '<div class="summary">' + UI.robi(stars >= 2 ? 'cheer' : 'happy', 'robi') + '<h2>' + (stars === 3 ? '¡Ronda perfecta!' : stars === 2 ? '¡Muy buena ronda!' : stars === 1 ? '¡Bien! Vas mejorando' : '¡Has aprendido un montón!') + '</h2>' + starsHTML(stars)
      + '<div class="sumgrid"><div><b>' + firsts + '/' + sess.res.length + '</b><span>a la primera</span></div><div><b>+' + (sess.xp + bonus) + '</b><span>combustible</span></div><div><b>' + Math.round(score * 100) + ' %</b><span>de puntuación</span></div></div>'
      + '<div class="lvchange">' + UI.mastSq(ch.old) + ' ' + UI.LV[ch.old] + ' ' + UI.ic('next') + ' ' + UI.mastSq(ch.nl) + ' <b>' + UI.LV[ch.nl] + '</b></div>'
      + (errs.length ? '<div class="sol" style="text-align:left"><h4>' + UI.ic('bulb') + ' Errores con los que has entrenado</h4><ul>' + errs.map(c => '<li><b>' + MM.ERR[c].t + ':</b> ' + MM.ERR[c].d + '</li>').join('') + '</ul></div>' : '')
      + (ch.nl === 3 ? '<p class="small">Para llegar a <b>Dominado</b>, acierta esta habilidad en la <b>Misión del día</b> otro día.</p>' : ch.nl < 3 ? '<p class="small">Consigue una ronda perfecta para llegar a <b>Competente</b>.</p>' : '')
      + '<div class="actions" style="justify-content:center"><button type="button" class="btn ghost" data-nav="back">Volver a la estación</button>' + (k2.lesson ? '' : '<button type="button" class="btn soft" data-nav="lesson" data-arg="' + id + '">' + UI.ic('book') + ' Ver la lección</button>') + '<button type="button" class="btn hot" data-again="1">' + UI.ic('play') + ' Otra ronda</button></div></div>';
    const r = $('.summary .robi', F.host); if (r) r.style.width = '96px';
    $('[data-again]', F.host).onclick = () => UI.go('practice', id, { noPush: true });
  };
  next();
};

/* ======================================================= misión del día (mezcla con repaso espaciado) */
const INTERVAL = [0, 1, 2, 4, 9].map(dd => dd * 86400000);
function dailyQueue() {
  const ids = Object.keys(MM.SKILLS).filter(id => UI.sk(id).att > 0 || UI.sk(id).lesson);
  if (!ids.length) return null;
  const now = Date.now();
  const scored = ids.map(id => { const k = UI.sk(id); const due = k.last ? (now - k.last) / (INTERVAL[Math.max(1, k.lv)] || 86400000) : 3; return { id, s: (k.lv <= 2 ? 1.5 : 0) + Math.min(3, due) + Math.random() * 0.8 }; }).sort((a, b) => b.s - a.s);
  const out = [];
  let k = 0;
  while (out.length < 6) { out.push(scored[k % scored.length].id); k++; if (k > 40) break; }
  return shuffle(out).map(id => { const lv = UI.sk(id).lv; return { id, d: lv >= 3 ? 3 : lv === 2 ? 2 : 1 }; });
}
SCREENS.daily = function () {
  const q = dailyQueue();
  if (!q) { UI.go('lesson', 'A1', { noPush: true }); return; }
  const sess = { i: 0, res: [], xp: 0, ch: [] };
  const F = pracFrame({ title: 'Misión del día', eyebrow: 'Repaso mezclado · ' + q.length + ' ejercicios' });
  guard = () => sess.i > 0 && sess.i < q.length;
  const next = () => {
    drawDots(q.length, sess.i, sess.res);
    if (sess.i >= q.length) return summary();
    const it = q[sess.i], B = blockOf(it.id);
    const ex = MM.SKILLS[it.id].gen(it.d);
    UI.mountExercise(F.host, ex, {
      kpHost: F.kp, allowSimilar: false, color: B.color, tag: 'Misión ' + (sess.i + 1) + ' de ' + q.length,
      onDone: r => {
        UI.record(it.id, r);
        const k = UI.sk(it.id), old = k.lv;
        if (r.credit === 1) k.lv = Math.min(4, Math.max(1, k.lv + 1)); else if (r.credit === 0) k.lv = Math.max(1, k.lv - 1); else if (k.lv === 0) k.lv = 1;

    let fit = pool.filter(t => estW(t, z.fs || 16) <= z.w);
    if (!fit.length) fit = pool.slice().sort((a, b) => a.length - b.length).slice(0, 1);
    let free = fit.filter(t => !seen.has(t)); if (!free.length) free = fit;

    if (r.ok === r.tot) {
      UI.snd('up'); UI.confetti();
      const first = !a.done;
      if (first) { a.done = Date.now(); UI.save(); UI.addXP(30); UI.refreshHud(); UI.checkBadges(); }
      fb.innerHTML = '<div class="fbbox ok">' + UI.robi('cheer', 'robi') + '<div><div class="ft">¡Cuadro descubierto!</div><div>Las ' + r.tot + ' zonas están bien. ' + (first ? '+30 de combustible. ' : '') + 'Ya está en tu galería. Pulsa «Ocultar números» para verlo limpio.</div></div></div>';
      return;
    }
    UI.snd('no');
    const bits = [];
    if (r.bad) bits.push((r.bad === 1 ? 'La zona marcada en rojo tiene' : 'Las ' + r.bad + ' zonas marcadas en rojo tienen') + ' otro color: repasa la cuenta.');
    if (r.empty) bits.push(r.empty === 1 ? 'Falta pintar una zona (la del «?»).' : 'Faltan ' + r.empty + ' zonas por pintar (las del «?»).');
    fb.innerHTML = '<div class="fbbox part">' + UI.robi('think', 'robi') + '<div><div class="ft">¡Llevas ' + r.ok + ' de ' + r.tot + '!</div><div>' + bits.join(' ') + '</div>' + (r.bad ? '<div class="actions" style="margin-top:6px"><button type="button" class="btn soft sm" data-p="hint">' + UI.ic('bulb') + ' Pista</button></div>' : '') + '</div></div>';
  };
  $('.picpage').addEventListener('click', e => {
    const b = e.target.closest('[data-p]'); if (!b) return;
    const act = b.dataset.p;
    if (act === 'check') return check();
    if (act === 'pad') return UI.Pad.open('<b>' + P.name + '</b><div>Haz aquí tus cuentas.</div>', 'pic-pad-' + pid);
    if (act === 'hide') { hide = !hide; b.innerHTML = UI.ic('zoom') + (hide ? ' Mostrar números' : ' Ocultar números'); redrawOver(); return; }
    if (act === 'hint') {
      const i = (marks || []).findIndex(m => m === 'bad'); if (i < 0) return;
      const z = P.zones[i], c = P.cats[z.k];
      UI.snd('hint');
      b.outerHTML = '<p class="small" style="margin:0"><b>Pista:</b> «' + MM.esc(a.lab[i]) + '» vale <b>' + valH(c.v) + '</b> → ' + UI.PALNAME[c.c] + '.</p>';
      return;
    }
    if (act === 'new') UI.modal('<h2>¿Empezar de nuevo?</h2><p>Se borra la pintura de este cuadro y salen cuentas nuevas.' + (a.done ? ' El cuadro sigue contando como descubierto.' : '') + '</p>', [{ t: 'Cancelar', cls: 'ghost' }, { t: 'Sí, empezar', cls: 'primary', fn: () => { a.lab = pickLabels(P); UI.save(); UI.inkPut('pic-' + pid, []); UI.flushAll(); UI.go('pic', pid, { noPush: true }); } }]);
  });
  /* para las pruebas automáticas: pintar todo bien (o con un error) */
  UI.__pic = { P, ink, check, solve: wrong => { const L = []; P.zones.forEach((z, i) => { if (z.k != null) L.push([i, PAL[P.cats[(z.k + (wrong && i === P.zones.findIndex(q => q.k != null) ? 1 : 0)) % P.cats.length].c]]); }); ink.setStrokes([]); ink.autoFill(L); } };
};
})();

MM.UI.start();
</script>
</body></html>
